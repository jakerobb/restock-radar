name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod

      - name: Build
        run: go build ./...
        working-directory: src

      - name: Vet
        run: go vet ./...
        working-directory: src

      - name: Test
        run: go test ./...
        working-directory: src

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only, to catch Dockerfile breakage before merge. Publishing
      # happens in docker-publish.yml after merge to master.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
