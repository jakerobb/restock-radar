name: CI

on:
  pull_request:
  workflow_dispatch:
  # Advisories are published against dependencies that haven't changed, so
  # scan weekly even when nothing is being merged.
  schedule:
    - cron: "23 6 * * 1"

jobs:
  # go and ui run on the homelab cluster's ARC runners (jakerobb/homelab,
  # argocd/apps/arc-runners-restock-radar/). Those pods keep Go and Node
  # toolchains, modules and the npm cache on a shared volume, so the setup
  # actions' own caching is turned off. The docker job (a Dockerfile lint) stays
  # on a GitHub-hosted runner: the pods have no Docker daemon.
  go:
    runs-on: arc-runner-restock-radar

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Build
        run: go build ./...
        working-directory: src

      - name: Vet
        run: go vet ./...
        working-directory: src

      - name: Test
        run: go test ./...
        working-directory: src

      # Fails on a known vulnerability in a package the code actually calls.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: src

  ui:
    runs-on: arc-runner-restock-radar

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Only what ships: build and test tooling is not in the image, and an advisory
      # with no fix (as picomatch's had) would otherwise block every PR.
      - name: Vulnerability scan
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      # Typechecks, then builds the production bundle.
      - name: Build
        run: npm run build

  # Lints the Dockerfile with hadolint. This used to build the image (both
  # platforms) to catch Dockerfile breakage; docker-publish.yml still builds it
  # on merge to main. The job is still called `docker` because the repo's
  # ruleset requires a check with that name.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
