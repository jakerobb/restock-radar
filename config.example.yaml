# Copy to /etc/restock-radar/config.yaml (or point CONFIG_PATH at it).
# ${VAR} references are replaced with environment variables in the ntfy block.

poll_interval: 20m   # time between full passes over every item
poll_jitter: 1m      # each wait is poll_interval +/- this, so we don't poll on a metronome
request_delay: 2s    # average pause between items within a pass
http_port: 8080
db_path: /data/restock-radar.db
# failure_alert_after: 3   # consecutive failed checks of one item before an ntfy alert
# max_items: 200           # cap on the watch list (config items plus ones added in the UI)

# Database backups: a consistent copy of the SQLite file every backup_interval,
# keeping the newest backup_keep. Point backup_dir at a volume that isn't the one
# holding db_path. Off unless backup_dir is set.
# backup_dir: /backups
# backup_interval: 24h
# backup_keep: 14

# Who may change things (add products, correct specs, refresh a product). By
# default nobody is asked, which suits a deployment only you can reach. Behind an
# authenticating proxy (Authelia, oauth2-proxy, ...), have the service believe the
# identity it forwards; see "Access control" in the README. Required if the site is
# reachable by anyone else (`public: true` is refused in the default mode).
# auth:
#   mode: proxy                  # open (default) | proxy
#   public: true
#   trusted_proxies: ["10.244.0.0/16"]   # networks whose requests may carry identity headers
#   # user_header: Remote-User            # these are Authelia's names, and the defaults
#   # name_header: Remote-Name
#   # email_header: Remote-Email
#   # groups_header: Remote-Groups
#   roles:                       # proxy groups that hold each role
#     admin: [admins]            # everything an editor may do, plus adding products
#     editor: [editors]          # correct specs, refresh a product

ntfy:
  url: https://ntfy.example.com
  topic: restock-radar
  token: ${NTFY_TOKEN}     # optional

# Optional; defaults to the US store. The store's other regions are built in, so a
# bare id is enough: us, ca, eu, uk, jp, br, tw, sg. (An entry may still give
# `base_url` and `path` to point somewhere else.) Stock and prices don't sync
# across regions. The first region is the default for items that name none.
regions:
  - id: us
  - id: ca
  - id: eu
  - id: uk
  - id: jp
  - id: br
  - id: tw
  - id: sg

# Items are the product slug from the store URL (store.ui.com/us/en/.../products/<slug>).
# Every variant of a product is watched. Old slugs that the store redirects also work.
# Add `region: <id>` to an item to pick a non-default region. Items listed here are
# kept in sync with this file; products added in the web UI are kept separately.
items:
